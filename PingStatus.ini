[MeasurePing1]

Measure=Plugin

Plugin=PingPlugin

DestAddress=[#Device1_IP]

UpdateRate=#UpdateInterval#

Timeout=#PingTimeout#

TimeoutValue=-1

Disabled=1

IfCondition=(MeasurePing1 > 0)

IfTrueAction=[!SetVariable Status1 "Online"][!SetOption Device1Indicator Shape "Ellipse 3,3,3 | Fill Color 100,220,100,255 | StrokeWidth 0"][!UpdateMeter Device1Indicator][!Redraw]

IfCondition2=(MeasurePing1 <= 0)

IfTrueAction2=[!SetVariable Status1 "Offline"][!SetOption Device1Indicator Shape "Ellipse 3,3,3 | Fill Color 255,100,100,255 | StrokeWidth 0"][!UpdateMeter Device1Indicator][!Redraw]

DynamicVariables=1



